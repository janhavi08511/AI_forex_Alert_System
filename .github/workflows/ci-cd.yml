name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/tradealert-backend

jobs:
  build:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build frontend
        working-directory: Frontend
        run: npm run build

      - name: Build backend JAR
        working-directory: trading_alert
        run: ./mvnw -B -DskipTests package

      - name: Log in to Docker registry
        uses: docker/login-action@v5
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: trading_alert
          file: trading_alert/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist

  deploy:
    name: Deploy to Production
    needs: build
    if: github.ref == 'refs/heads/main' && secrets.PRODUCTION_SERVER_HOST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SERVER_SSH_KEY }}

      - name: Deploy backend container to production
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.PRODUCTION_SERVER_USER }}@${{ secrets.PRODUCTION_SERVER_HOST }} <<'EOF'
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker stop tradealert-backend || true
            docker rm tradealert-backend || true
            docker run -d --name tradealert-backend --restart unless-stopped -p 8080:8080 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          EOF

  deploy-frontend:
    name: Deploy Frontend Build
    needs: build
    if: github.ref == 'refs/heads/main' && secrets.PRODUCTION_FRONTEND_SERVER_HOST
    runs-on: ubuntu-latest

    steps:
      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SERVER_SSH_KEY }}

      - name: Deploy frontend static files to production
        run: |
          rsync -avz --delete frontend-dist/ ${{ secrets.PRODUCTION_SERVER_USER }}@${{ secrets.PRODUCTION_FRONTEND_SERVER_HOST }}:${{ secrets.PRODUCTION_FRONTEND_SERVER_DEPLOY_PATH }}
